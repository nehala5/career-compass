<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Career Compass | Student Management</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script defer src="js/students.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-resize-handle"></div>
            <h2>Career Compass</h2>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="users.html">User Management</a></li>
                <li><a href="placements.html">Placement Management</a></li>
                <li><a href="students.html" class="active">Student Management</a></li>
                <li><a href="companies.html">Company Management</a></li>
                <li><a href="analytics.html">Reports & Analytics</a></li>
                <li><a href="notifications.html">Notifications</a></li>
                <li><a href="chatbot.html">Chatbot</a></li>
                <li><a href="followups.html">Follow-ups</a></li>
                <li><a href="faculty-dashboard.html">Faculty Dashboard</a></li>
            </ul>
            <div class="toggle-container">
                <label for="darkModeToggle">🌌 Cosmic Mode</label>
                <input type="checkbox" id="darkModeToggle" />
            </div>
        </aside>

        <main class="main">
            <header>
                <h1>Student Management</h1>
                <div>
                    <input type="text" id="searchStudents" placeholder="Search by Name or Email..." oninput="filterStudents()">
                    <button id="addStudentBtn" class="btn-add">Add Student</button>
                </div>
            </header>

            <section id="studentForm" style="display: none;">
                <form id="studentFormData">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="Name" required>
                        <input type="email" id="email" placeholder="Email">
                        <input type="text" id="phone_number" placeholder="Phone Number">
                        <select id="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="ME">ME</option>
                        </select>
                        <input type="number" id="graduation_year" placeholder="Graduation Year">
                        <input type="text" id="skills" placeholder="Skills (comma-separated)">
                        <input type="text" id="branch" placeholder="Branch">
                    </div>
                    <button type="submit" id="saveStudentBtn">Add Student</button>
                    <button type="button" id="cancelStudentBtn">Cancel</button>
                </form>
            </section>

            <section>
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Graduation Year</th>
                            <th>Skills</th>
                            <th>Branch</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
